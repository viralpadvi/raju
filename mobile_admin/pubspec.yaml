name: admin_mobile
description: Flutter admin console for the Laravel commerce backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  go_router: ^14.1.0
  dio: ^5.4.2
  dio_retry_plus: ^2.0.6
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  workmanager: ^0.5.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  intl: ^0.19.0
  flex_color_scheme: ^8.3.1
  collection: ^1.18.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.1.0
  uuid: ^4.4.0
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/

